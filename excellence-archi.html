<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Salle d'Excellence — EdukaTchat</title>
<style>
:root{--bg:#f3f5f9;--carte:#fff;--txt:#1b2335;--doux:#657088;--bleu:#1e3a6e;--bleu-clair:#e7eefb;--bord:#dde2ec;
  --ok:#1d7a4c;--ok-fond:#e4f4ec;--ko:#b3392f;--ko-fond:#fbeceb;--medaille:#b8860b;--ombre:0 1px 2px rgba(20,30,60,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--carte:#1a2130;--txt:#e8ecf4;--doux:#97a1b6;--bleu:#8fb0ff;--bleu-clair:#1f2c4a;--bord:#2b344a;
  --ok:#52c48c;--ok-fond:#14332a;--ko:#f08a80;--ko-fond:#3a1d1f;--medaille:#e0b33f;--ombre:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.page{max-width:880px;margin:0 auto;padding:16px 16px 70px}
h1{font:700 1.6rem/1.2 Georgia,serif;margin:6px 0 2px}
h2{font:700 1.15rem/1.3 Georgia,serif;margin:0}
.sous{color:var(--doux);margin:0 0 14px;font-size:.95rem}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--bleu);outline-offset:2px;border-radius:8px}
.nav{display:flex;gap:8px;margin:10px 0 14px}
.nav button{flex:1;min-height:44px;border:1px solid var(--bord);background:var(--carte);border-radius:10px;font-size:.95rem;font-weight:600}
.nav button[aria-current=page]{background:var(--bleu);border-color:var(--bleu);color:#fff}
@media(prefers-color-scheme:dark){.nav button[aria-current=page]{color:#10151f}}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:16px;margin:10px 0;box-shadow:var(--ombre)}
.resume{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.resume .n{font:700 2.1rem/1 Georgia,serif}
.resume .t{flex:1;min-width:180px}
.barre{height:8px;border-radius:99px;background:var(--bleu-clair);overflow:hidden}
.barre i{display:block;height:100%;background:var(--bleu);border-radius:99px}
.matieres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px}
.matiere{text-align:left;background:var(--carte);border:2px solid var(--bord);border-radius:14px;padding:12px;min-height:84px;display:flex;flex-direction:column;gap:6px}
.matiere b{font-weight:650;line-height:1.2}
.matiere span{color:var(--doux);font-size:.88rem}
.matiere[aria-pressed=true]{border-color:var(--bleu);background:var(--bleu-clair)}
.palier{margin:24px 0 0}
.palier-tete{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.palier-tete small{color:var(--doux)}
.grille{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.tuile{display:flex;gap:12px;align-items:flex-start;width:100%;height:100%;text-align:left;background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:13px;min-height:88px;box-shadow:var(--ombre)}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--bord);color:var(--doux)}
.num svg{width:17px;height:17px}
.tuile b{display:block;font-weight:650;line-height:1.25}
.tuile small{color:var(--doux)}
.ouvert .tuile{border-color:var(--bleu)}
.ouvert .tuile:hover{background:var(--bleu-clair)}
.ouvert .num{border-color:var(--bleu);color:var(--bleu)}
.valide .tuile{border-color:var(--ok)}
.valide .num{background:var(--ok);border-color:var(--ok);color:#fff}
.verrouille .tuile{cursor:not-allowed;opacity:.6;box-shadow:none}
.score{display:block;margin-top:4px;font-weight:700;color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 20px;border-radius:10px;border:1px solid var(--bleu);font-weight:650;color:var(--bleu);background:var(--carte)}
.btn.plein{background:var(--bleu);color:#fff}
@media(prefers-color-scheme:dark){.btn.plein{color:#10151f}}
.btn:disabled{opacity:.45;cursor:default}
.lien{color:var(--doux);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center}
.meta{color:var(--doux);font-size:.92rem;margin:0 0 8px}
.enonce{font:1.15rem/1.65 Georgia,serif;margin:0}
.champ{display:block;width:100%;font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--bord);border-radius:10px;padding:11px 12px;margin:6px 0 14px}
.rep{display:flex;gap:10px;align-items:center;margin:12px 0}
.rep .champ{margin:0;flex:1;font-size:1.15rem}
.rep span{color:var(--doux)}
label.l{font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.indice{background:var(--bleu-clair);border-radius:10px;padding:9px 12px;margin:8px 0}
.faux{background:var(--ko-fond);color:var(--ko);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:550}
.corrige{background:var(--ok-fond);border-radius:10px;padding:12px 14px;margin:12px 0}
.corrige b{display:block;color:var(--ok);margin-bottom:2px}
.gros{font:700 2.5rem/1 Georgia,serif;color:var(--ok);margin:6px 0 2px}
.gros small{font-size:1.05rem;color:var(--doux);font-weight:400}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--bord)}
th{color:var(--doux);font-weight:600;font-size:.9rem}
.rang{font:700 1.1rem Georgia,serif;width:2.2em}.rang.un{color:var(--medaille)}
.vide{color:var(--doux)}.erreur{color:var(--ko);font-weight:600}
@media(max-width:560px){.matieres{gap:8px}.matiere{padding:10px;min-height:78px}.matiere b{font-size:.9rem}h1{font-size:1.4rem}}
</style></head><body><main class="page">
<h1>🏛️ Salle d'Excellence</h1>
<p class="sous">Chaque verrou a tes propres chiffres : rien à recopier, tout à comprendre. Franchis-en un pour ouvrir le suivant.</p>
<div id="app" aria-live="polite"></div></main>
<script>
const API=(window.SALLE_API||"https://api.edukatchat.org")+"/api/excellence";
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CADENAS='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.2" y="7" width="9.6" height="6.6" rx="1.4"/><path d="M5.4 7V5.2a2.6 2.6 0 015.2 0V7"/></svg>';
const COCHE='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const PALIERS={1:"Les bases à maîtriser sans hésiter",2:"Des problèmes qui demandent de la méthode",3:"Le niveau des classes préparatoires"};
function appareil(){try{let a=localStorage.getItem("eduka_appareil");if(!a||a.length<16){a=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now())+"-s";localStorage.setItem("eduka_appareil",a)}return a}catch(e){return window.__a||(window.__a=String(Math.random()).slice(2)+"abcdefghijkl")}}
function matricule(){try{return localStorage.getItem("excellence_code")||""}catch(e){return window.__code||""}}
async function appel(chemin,corps){
  const r=await fetch(API+chemin,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({appareil:appareil(),matricule:matricule()},corps||{}))});
  let j={};try{j=await r.json()}catch(e){} if(!r.ok)throw new Error(j.detail||"Erreur "+r.status);return j}
let etat={vue:"accueil",mat:null};
try{etat.mat=localStorage.getItem("excellence_matiere")}catch(e){}
function aller(v){etat.vue=v;rendre()}
function menu(){const t=[["accueil","Verrous"],["honneur","Honneur"],["proposer","Proposer"]];
  return `<nav class="nav" aria-label="Sections">`+t.map(([k,l])=>`<button ${etat.vue===k?'aria-current="page"':""} onclick="aller('${k}')">${l}</button>`).join("")+`</nav>`}
function demanderCode(){$("#app").innerHTML=`<div class="carte"><h2>Accès réservé</h2><p class="meta">La Salle d'Excellence n'est pas encore ouverte à tous. Entre ton code d'accès pour continuer.</p>
  <label class="l" for="code">Code d'accès</label><input class="champ" id="code" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')validerCode()">
  <button class="btn plein" onclick="validerCode()">Entrer</button></div>`}
function validerCode(){const c=$("#code").value.trim();try{localStorage.setItem("excellence_code",c)}catch(e){window.__code=c}rendre()}
const nbV=m=>m.paliers.reduce((a,p)=>a+p.defis.filter(d=>d.statut==="valide").length,0);
const nbT=m=>m.paliers.reduce((a,p)=>a+p.defis.length,0);
async function rendre(){
  const el=$("#app");
  try{
    if(etat.vue==="defi")return rendreDefi();
    if(etat.vue==="honneur")return rendreHonneur();
    if(etat.vue==="proposer")return rendreProposer();
    const c=await appel("/catalogue");
    if(!c.pseudo){el.innerHTML=`<div class="carte"><h2>Choisis ton pseudonyme</h2><p class="meta">Il apparaîtra au tableau d'honneur. Pas de vrai nom, et pas de numéro de téléphone.</p>
      <label class="l" for="pseudo">Pseudonyme</label><input class="champ" id="pseudo" maxlength="20" autocomplete="off" onkeydown="if(event.key==='Enter')inscription()">
      <button class="btn plein" onclick="inscription()">Entrer dans la salle</button><p id="err" class="erreur" role="alert"></p></div>`;return}
    if(!c.matieres.some(m=>m.cle===etat.mat))etat.mat=c.matieres[0].cle;
    const m=c.matieres.find(x=>x.cle===etat.mat);
    const pct=Math.round(100*c.nb_valides/c.nb_total);
    let h=menu()+`<div class="carte resume"><div class="n">${c.nb_valides}/${c.nb_total}</div><div class="t"><b>${esc(c.pseudo)}</b><div class="meta" style="margin:0 0 6px">verrous franchis</div><div class="barre" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div></div></div>`;
    h+=`<div class="matieres">`+c.matieres.map(x=>{const v=nbV(x),t=nbT(x);return `<button class="matiere" aria-pressed="${x.cle===etat.mat}" onclick="choisirMatiere('${x.cle}')"><b>${esc(x.nom)}</b><span>${v} sur ${t}</span><div class="barre"><i style="width:${Math.round(100*v/t)}%"></i></div></button>`}).join("")+`</div>`;
    for(const p of m.paliers){
      const v=p.defis.filter(d=>d.statut==="valide").length;
      h+=`<section class="palier"><div class="palier-tete"><h2>Palier ${p.palier} : ${esc(p.nom)}</h2><small>${esc(PALIERS[p.palier]||"")} (${v}/${p.defis.length})</small></div><ul class="grille">`;
      p.defis.forEach((d,i)=>{
        const ic=d.statut==="valide"?COCHE:(d.statut==="verrouille"?CADENAS:String(i+1));
        const etiq=d.statut==="valide"?"":(d.statut==="ouvert"?"À relever":"Verrouillé");
        h+=`<li class="${d.statut}"><button class="tuile" ${d.statut==="verrouille"?'disabled aria-disabled="true"':""} onclick="ouvrir('${d.id}')"><span class="num" aria-hidden="true">${ic}</span><span><b>${esc(d.titre)}</b><small>Niveau ${esc(d.niveau)}${etiq?" · "+etiq:""}</small>${d.score!=null?`<span class="score">${d.score}/100</span>`:""}</span></button></li>`});
      h+=`</ul></section>`}
    el.innerHTML=h}catch(e){if(e.message==="Introuvable.")return demanderCode();el.innerHTML=menu()+`<p class="erreur">${esc(e.message)}</p>`}}
function choisirMatiere(k){etat.mat=k;try{localStorage.setItem("excellence_matiere",k)}catch(e){}rendre()}
async function inscription(){try{await appel("/inscrire",{pseudo:$("#pseudo").value});rendre()}catch(e){$("#err").textContent=e.message}}
async function ouvrir(id){try{etat.defi=await appel("/defi/ouvrir",{defi_id:id});etat.vue="defi";rendre();window.scrollTo(0,0)}catch(e){alert(e.message)}}
function rendreDefi(){const d=etat.defi,r=d.resultat;
  let h=`<button class="lien" onclick="aller('accueil')">Retour aux verrous</button><div class="carte"><p class="meta">${esc(d.titre)} · palier ${d.palier} · niveau ${esc(d.niveau)}</p><p class="enonce">${esc(d.enonce)}</p>`;
  for(const i of d.indices_debloques)h+=`<div class="indice">Indice : ${esc(i)}</div>`;
  if(d.etat==="valide"){
    h+=`<p class="gros">${d.score}<small> / 100</small></p><p class="meta">Verrou franchi${r&&r.duree_s?` en ${Math.max(1,Math.round(r.duree_s/60))} min`:""}.</p>`;
    if(d.explication)h+=`<div class="corrige"><b>Corrigé</b>${esc(d.explication)}</div>`;
    const suiv=r&&r.suivant;
    h+=`<div class="actions">${suiv?`<button class="btn plein" onclick="ouvrir('${suiv.id}')">Verrou suivant : ${esc(suiv.titre)}</button>`:(r?`<span class="meta">Tu as terminé cette matière.</span>`:"")}<button class="btn" onclick="aller('accueil')">Retour aux verrous</button></div>`}
  else{
    h+=`<div class="rep"><input class="champ" id="rep" inputmode="decimal" autocomplete="off" aria-label="Ta réponse" placeholder="Ta réponse" onkeydown="if(event.key==='Enter')repondre()">${d.unite?`<span>${esc(d.unite)}</span>`:""}</div>
      <div class="actions"><button class="btn plein" onclick="repondre()">Valider</button><button class="btn" onclick="indice()" ${d.indices_debloques.length>=d.nb_indices_total?"disabled":""}>Indice (moins 20 points)</button></div><div id="msg" role="alert"></div>`}
  $("#app").innerHTML=h+"</div>"}
async function indice(){try{const r=await appel("/defi/indice",{defi_id:etat.defi.id});etat.defi.indices_debloques.push(r.indice);rendreDefi()}catch(e){$("#msg").innerHTML=`<div class="faux">${esc(e.message)}</div>`}}
async function repondre(){const v=$("#rep").value;if(!v.trim())return;
  try{const r=await appel("/defi/repondre",{defi_id:etat.defi.id,reponse:v});
    if(r.status==="juste"){Object.assign(etat.defi,{etat:"valide",score:r.score,explication:r.explication,resultat:r});rendreDefi();window.scrollTo(0,0)}
    else $("#msg").innerHTML=`<div class="faux">${esc(r.message)}${r.bloque_s?` Pause de ${r.bloque_s} secondes avant le prochain essai.`:""}</div>`}
  catch(e){$("#msg").innerHTML=`<div class="faux">${esc(e.message)}</div>`}}
async function rendreHonneur(){const r=await appel("/honneur");
  let h=menu()+`<div class="carte"><h2>Tableau d'honneur</h2>`;
  if(!r.palmares.length)h+=`<p class="vide">Personne n'a encore franchi de verrou. Le premier nom sera le tien.</p>`;
  else{h+=`<table><tr><th></th><th>Pseudonyme</th><th>Verrous</th><th>Points</th></tr>`;
    r.palmares.forEach((p,i)=>h+=`<tr><td class="rang${i===0?" un":""}">${i+1}</td><td>${esc(p.pseudo)}</td><td>${p.verrous}</td><td>${p.points}</td></tr>`);h+=`</table></div><div class="carte"><h2>Derniers verrous franchis</h2><table>`;
    r.recentes.forEach(x=>h+=`<tr><td>${esc(x.pseudo)}</td><td>${esc(x.titre)}</td><td>${x.score}/100</td><td class="vide">${esc(x.date)}</td></tr>`);h+=`</table>`}
  $("#app").innerHTML=h+`</div>`}
function rendreProposer(){$("#app").innerHTML=menu()+`<div class="carte"><h2>Proposer un exercice</h2><p class="meta">Un exercice que tu n'as pas su résoudre ? Envoie-le en photo. Il est relu avant toute publication ; s'il est retenu, il devient un verrou signé de ton pseudonyme.</p>
  <label class="l" for="pm">Matière</label><select class="champ" id="pm"><option value="maths">Mathématiques</option><option value="physique-chimie">Physique-Chimie</option><option value="svt">SVT</option></select>
  <label class="l" for="pn">Niveau</label><input class="champ" id="pn" placeholder="Par exemple : Tle" maxlength="20">
  <label class="l" for="pt">Un mot d'explication (facultatif)</label><textarea class="champ" id="pt" rows="2" maxlength="400"></textarea>
  <label class="l" for="pf">Photo (JPEG ou PNG, 4 Mo maximum)</label><input class="champ" type="file" id="pf" accept="image/jpeg,image/png">
  <button class="btn plein" onclick="envoyerPhoto()">Envoyer la photo</button><div id="pmsg" role="alert"></div></div>`}
async function envoyerPhoto(){const f=$("#pf").files[0];if(!f){$("#pmsg").innerHTML=`<div class="faux">Choisis d'abord une photo.</div>`;return}
  const fd=new FormData();fd.append("photo",f);fd.append("appareil",appareil());fd.append("matricule",matricule());fd.append("matiere",$("#pm").value);fd.append("niveau",$("#pn").value);fd.append("message",$("#pt").value);
  try{const r=await fetch(API+"/proposer",{method:"POST",body:fd});const j=await r.json();$("#pmsg").innerHTML=r.ok?`<div class="corrige"><b>Photo reçue</b>${esc(j.message)}</div>`:`<div class="faux">${esc(j.detail)}</div>`}catch(e){$("#pmsg").innerHTML=`<div class="faux">Connexion impossible. Réessaie dans un instant.</div>`}}
rendre();
</script></body></html>
