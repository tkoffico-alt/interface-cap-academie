<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdukaTchat | Le sanctuaire numérique de l'enseignement ivoirien</title>
    <link rel="icon" type="image/png" href="logo-edukatchat.png">
    <style>
        /* --- FONDATIONS --- */
        * {

            padding: 0;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: auto; 
        }

        body {

            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- L'EN-TÊTE TRANSLUCIDE --- */
        header {
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-signature {
            height: 45px;
            width: auto;
            border-radius: 8px;
            object-fit: contain;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            background-color: #FFFFFF;
            padding: 2px;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .brand-text h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .badge-pilote {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background-color: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.5);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
            color: #60A5FA;
        }

        .brand-text p {
            color: #94A3B8;
            font-size: 0.85rem;
            margin-top: 0.2rem;
        }

        /* --- LE SAS D'ACCUEIL --- */
        #home-view {
            flex: 1;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .container-sas {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 1rem;
        }
        
        .hero h2 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 1rem;
            letter-spacing: -0.025em;
        }
        
        .hero p {
            font-size: 1.05rem;
            color: #94A3B8;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .hero strong {
            color: #F8FAFC;
        }

        /* L'Esthétique Glassmorphism pour toutes les cartes */
        .glass-card {
            background-color: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(71, 85, 105, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* Grille des 4 Portes - Alignement 2 par 2 */
        .doors {
            display: grid;
            grid-template-columns: repeat(2, minmax(300px, 1fr));
            gap: 2rem;
            justify-content: center;
            max-width: 800px; 
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .doors {
                grid-template-columns: 1fr;
            }
        }

        .door-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .door-card:hover {
            transform: translateY(-5px);
            background-color: rgba(30, 41, 59, 0.7);
        }

        .sas:hover { border-color: #10B981; box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(16, 185, 129, 0.3); }
        .eleve:hover { border-color: #3B82F6; box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(59, 130, 246, 0.4); }
        .enseignant:hover { border-color: #A855F7; box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(168, 85, 247, 0.4); }
        .parents:hover { border-color: #94A3B8; box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(148, 163, 184, 0.4); }

            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            font-size: 1.8rem;
        }

        .sas .icon-wrapper { background-color: rgba(16, 185, 129, 0.1); color: #34D399; }
        .eleve .icon-wrapper { background-color: rgba(59, 130, 246, 0.1); color: #60A5FA; }
        .enseignant .icon-wrapper { background-color: rgba(168, 85, 247, 0.1); color: #C084FC; }
        .parents .icon-wrapper { background-color: rgba(148, 163, 184, 0.1); color: #94A3B8; }

        .door-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #F8FAFC;
            margin-bottom: 0.75rem;
        }

        .door-card p {
            color: #94A3B8;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
            flex-grow: 1;
        }

        .btn-entrer {
            width: 100%;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            color: #FFFFFF;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .sas .btn-entrer { background-color: #10B981; }
        .sas .btn-entrer:hover { background-color: #059669; }
        
        .eleve .btn-entrer { background-color: #3B82F6; }

        .enseignant .btn-entrer { background-color: #A855F7; }
        .enseignant .btn-entrer:hover { background-color: #9333EA; }
        
        .parents .btn-entrer { background-color: #475569; }
        .parents .btn-entrer:hover { background-color: #334155; }

        /* Section Informations */
        .info-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        .info-box h4 {
            font-size: 1.2rem;
            color: #F8FAFC;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid rgba(71, 85, 105, 0.5);
            padding-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .info-box p {
            color: #CBD5E1;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .info-box ul { list-style-type: none; }
        
        .info-box li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
            color: #94A3B8;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .info-box li strong { color: #E2E8F0; }

        .info-box li::before {
            content: "✦";
            position: absolute;
            left: 0;
            color: #3B82F6;
            font-size: 0.9rem;
        }

        .news-box {
            border-left: 4px solid #3B82F6;
        }
        
        .news-box li::before {
            content: "•";
            color: #60A5FA;
            font-size: 1.2rem;
            top: -2px;
        }

        /* --- L'ESPACE DE TRAVAIL --- */
        #app-view {
            display: none;
            flex: 1;
            flex-direction: column;
            background-color: #020617;
            height: 100vh;
        }
        
        .toolbar {
            background-color: #0F172A;
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            border-bottom: 1px solid #1E293B;
            flex-shrink: 0;
        }
        
        .btn-retour {
            background: none;
            border: 1px solid #334155;
            color: #94A3B8;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .btn-retour:hover { 
            background-color: #1E293B;
            color: #F8FAFC; 
        }

        .btn-fullscreen {
            background-color: rgba(37, 99, 235, 0.1);
            color: #60A5FA;
            border: 1px solid #2563EB;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-fullscreen:hover {
            background-color: #2563EB;
            color: #FFFFFF;
        }

        .teacher-navigation {
            display: none;
            gap: 0.5rem;
            margin-left: auto;
        }

        .tab-btn {
            background-color: transparent;
            color: #64748B;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #CBD5E1;
            background-color: rgba(30, 41, 59, 0.5);
        }

        .tab-btn.active {
            background-color: rgba(168, 85, 247, 0.15);
            color: #C084FC;
        }
        
        .iframe-container {
            flex: 1;
            width: 100%;
            position: relative;
        }
